<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Você ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd1dc,#ffe8ee);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:350px;
    text-align:center;
    z-index:2;
}

.card{
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
    padding:35px 25px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    color:#ff4d88;
    margin-bottom:20px;
}

p{
    color:#555;
    line-height:1.7;
    font-size:17px;
}

button{
    margin-top:30px;
    border:none;
    background:#ff4d88;
    color:white;
    padding:16px 30px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

#surpresa{
    display:none;
    animation:aparecer 1s;
}

video{
    width:100%;
    border-radius:20px;
    margin-top:20px;
}

.frase{
    margin-top:20px;
    color:#ff4d88;
    font-size:20px;
    font-weight:bold;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* corações flutuando */
.coracao{
    position:absolute;
    color:#ff8fb1;
    animation:subir linear infinite;
    opacity:.7;
}

@keyframes subir{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}
</style>
</head>
<body>

<!-- corações -->
<div class="coracao" style="left:10%;font-size:25px;animation-duration:8s;">❤️</div>
<div class="coracao" style="left:30%;font-size:18px;animation-duration:10s;">💕</div>
<div class="coracao" style="left:50%;font-size:30px;animation-duration:7s;">❤️</div>
<div class="coracao" style="left:70%;font-size:22px;animation-duration:11s;">💖</div>
<div class="coracao" style="left:90%;font-size:28px;animation-duration:9s;">💕</div>

<div class="container">

    <div class="card">

        <div id="inicio">
            <h1>Oi, princesa ❤️</h1>

            <p>
                Não sou muito bom em demonstrar tudo o que penso, mas queria que você soubesse que adoro conversar com você e que o seu sorriso tem um jeito especial de deixar meu dia melhor. ✨
                <br><br>
                Então preparei uma pequena surpresa...
            </p>

            <button onclick="mostrarSurpresa()">
                Receba um beijo 😘
            </button>
        </div>

        <div id="surpresa">
            <h1>Muah! 😽💕</h1>

            <!-- coloque aqui o link do vídeo ou substitua pelo arquivo -->
            <img src="kiss.gif" alt="Description of the animation">

            <div class="frase">
                Se eu pudesse, esse beijo seria meu. ❤️
            </div>
        </div>

    </div>

</div>

<script>
function mostrarSurpresa(){
    document.getElementById("inicio").style.display = "none";
    document.getElementById("surpresa").style.display = "block";
}
</script>

</body>
</html>
